                        <ToggleButton options={lvOptions} value={P.lv} onChange={P.setLv}/>
                      </div>
                      <button className={`status-btn ${P.ready?"wait":"ready"}`}
                        onPointerDown={()=>{ playClick(); P.setReady(!P.ready); }}>
                        {P.ready?"⏳ まってね":"✓ けってい！"}
                      </button>
                    </>}
              </div>
            ); };
            // けっか（タップでウインドウ →「もう一回！」「えらびなおす」）
            const resultArea = (p) => { const P = PL[p], won = winner===p; return (
              <div className="duo-result-area"
                onPointerDown={()=>{
                  if (resOpen[p] || performance.now()-overAt.current <= 700) return;
                  playClick();
                  // 相手がもうモード選択にいるなら、タップでそのままモード選択へ
                  if (duoView[p===1?2:1]==="setup") setDuoView(v=>({ ...v, [p]:"setup" }));
                  else setResOpen(o=>({ ...o, [p]:true }));
                }}>
                <div className="result-band" style={{
                  background:won?"rgba(255,255,255,0.82)":"rgba(255,255,255,0.55)",
                  color:won?palette.accentDark:"rgba(30,35,0,0.50)"
                }}>
                  {won?"🎉 クリア！！":"🏳️ そこまで…"}
                  {!resOpen[p] && <div className="tap-hint">タップしてね</div>}
                </div>
                {resOpen[p] && (
                  <div className="duo-res-win" style={glassCard} onPointerDown={e=>e.stopPropagation()}>
                    <div className="duo-res-title">{won?"🏆 かち！":"おしかった！"}<span>{P.score}点</span></div>
                    <button className="start-btn" style={P.ready
                        ? {background:"linear-gradient(135deg,#4a9e62,#2e7d46)"}
                        : {background:palette.accentGrad,boxShadow:`0 4px 20px ${palette.accentShadow}`}}
                      onPointerDown={e=>{ e.preventDefault(); playClick(); P.setReady(!P.ready); }}>
                      {P.ready?"⏳ まってね":"もう一回！"}
                    </button>
                    <button className="start-btn secondary"
                      onPointerDown={e=>{
                        e.preventDefault(); playClick(); setP1Ready(false); setP2Ready(false);
                        // 相手がまだ「クリア／そこまで…」を見ている（タップ前）なら、相手はそのまま
                        const o = p===1?2:1;
                        setDuoView(v=>({ ...v, [p]:"setup", [o]: resOpen[o] ? "setup" : v[o] }));
                      }}>
                      えらびなおす
                    </button>
                  </div>
                )}
              </div>
            ); };
            const content = (p) => {
              const P = PL[p];
              if (duoPhase==="countdown") return <div className="countdown-num" key={p+"-"+countdown}>{countdown}</div>;
              if (duoPhase==="game") return <GamePanel isMini current={P.q} feedback={P.fb}
                onAnswer={v=>handleDuoAns(p,v)} typed={P.typed} hw={hw} hand={P.hand} locked={!!winner} rotated={p===2} accent={palette.accent}/>;
              if (duoPhase==="over" && duoView[p]==="result") return resultArea(p);
              return <div style={{width:"100%",display:"flex",justifyContent:"center",padding:"8px 12px",position:"relative",zIndex:1}}>{setupCard(p)}</div>;
            };
            const header = (p, top) => (
              <div style={{
                textAlign:"center",color:"#0e2010",fontWeight:900,padding:"6px 0",fontSize:"0.9rem",
                background:top?"rgba(255,255,255,0.25)":"rgba(255,255,255,0.20)",
                [top?"borderBottom":"borderTop"]:"2px solid rgba(255,255,255,0.52)"
              }}>
                {PL[p].icon}&nbsp;{PL[p].name}
                <span style={{marginLeft:10,fontWeight:900,fontSize:"0.9rem",color:palette.accentDark}}>{PL[p].score}点</span>
              </div>
            );
            // けっかのときは、二人ともタップするまで出さない（ゴールした動物を見せる）
            const tapped = p => resOpen[p] || duoView[p]==="setup";
            const canPickGoal = duoPhase==="setup" || (duoPhase==="over" && tapped(1) && tapped(2));
            const pos = sc => `${Math.min(1, sc/duoGoal)*100}%`;
            // トラックの動物：正解で進むときは小さく跳ねながら、勝った方はゴールでぴょんぴょん
            const animal = p => {
              const won = duoPhase==="over" && winner===p, sc = PL[p].score;
              return won
                ? <span className="race-animal race-win">{PL[p].icon}</span>
                : <span key={sc} className={`race-animal ${sc>0?"race-hop":""}`}>{PL[p].icon}</span>;
            };
            return (
              <div style={{flex:1,width:"100%",display:"flex",flexDirection:"column",zIndex:10}}>
                {/* P2エリア（上・回転） */}
                <div style={{transform:"rotate(180deg)",flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
                  {header(2,true)}
                  <div className="duo-area">{duoPhase==="over" && winner===2 && <Confetti contained/>}{content(2)}</div>
                </div>

                {/* レーストラック */}
                <div className="race-track">
                  <div className="race-label" style={{left:65,background:"rgba(200,165,20,0.92)",color:"#3a2200"}}>START</div>
                  <div className="race-label" style={{right:65,background:"rgba(168,40,40,0.92)",color:"white"}}>GOAL!</div>
                  <div style={{position:"absolute",left:140,right:140,top:0,bottom:0}}>
                    {[...Array(duoGoal+1)].map((_,i)=>(
                      <div key={i} style={{position:"absolute",height:"100%",width:1,background:"rgba(255,255,255,0.35)",left:`${(i/duoGoal)*100}%`}}/>
                    ))}
                    <div className="race-icon" style={{left:pos(p2Score),top:"3%",transform:"translateX(-50%) rotate(180deg)"}}>{animal(2)}</div>
                    <div className="race-icon" style={{left:pos(p1Score),top:"48%",transform:"translateX(-50%)"}}>{animal(1)}</div>
                  </div>
                  {/* 問題数（えらぶとき・けっかのときだけ、トラックの上に重ねる） */}
                  {canPickGoal && (
                    <div className="goal-toggle">
                      <ToggleButton options={[{v:5,l:"5もん"},{v:10,l:"10もん"},{v:20,l:"20もん"}]} value={duoGoal} onChange={setDuoGoal}/>
                    </div>
                  )}
                </div>

                {/* P1エリア（下） */}
                <div style={{flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
                  {header(1,false)}
                  <div className="duo-area">{duoPhase==="over" && winner===1 && <Confetti contained/>}{content(1)}</div>
                </div>
              </div>
            );
          })()}

          
{/* ════════════════════════════════
              リザルト
          ════════════════════════════════ */}
          {screen.includes("result") && (
            <>
              <Confetti/>
              <div style={{
                ...glassCard,
                width:"92%",maxWidth:400,
                zIndex:1000,animation:"cPop 0.4s",
                padding:"36px 28px",textAlign:"center"
              }}>
                <div style={{fontSize:"4.5rem",marginBottom:8}}>🏆</div>
                <h2 style={{color:"#0e2010",fontSize:"1.6rem",fontWeight:900,marginBottom:20}}>
                  結果発表
                </h2>

                {screen.includes("solo")
                  ? <>
                      <div className="result-score">{finalScoreRef.current}</div>
                      <div className="result-label">もん せいかい</div>
                      <div style={{color:"rgba(20,35,0,0.55)",fontSize:"0.9rem",marginTop:10,fontWeight:800}}>
                        🎖️ {getRankLabel(finalScoreRef.current)}
                      </div>
                    </>
                  : <>
                      <div style={{fontSize:"1.6rem",fontWeight:900,marginBottom:4,color:palette.accentDark}}>
                        {winnerName}
                      </div>
                      <div className="result-label">のかち！</div>
                      <div style={{display:"flex",justifyContent:"center",gap:24,marginTop:12}}>
                        <div style={{color:"rgba(30,35,0,0.58)",fontWeight:800,fontSize:"0.9rem"}}>
                          {p1Name}：{p1Score}点
                        </div>
                        <div style={{color:"rgba(30,35,0,0.58)",fontWeight:800,fontSize:"0.9rem"}}>
                          {p2Name}：{p2Score}点
                        </div>
                      </div>
                    </>
                }

                <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:28}}>
                  <button className="start-btn"
                    style={{
                      background:palette.accentGrad,
                      boxShadow:`0 4px 20px ${palette.accentShadow}`
                    }}
                    onPointerDown={()=>{
                      screen.includes("time")  ? startSoloTime()  :
                      screen.includes("death") ? startSoloDeath() :
                      startDuo();
                    }}>
                    もう一回！
                  </button>
                  <button className="start-btn secondary"
                    onPointerDown={()=>{ playClick(); navigate(screen.includes("time")?"solo-setup-time":"solo-setup-death"); }}>
                    もどる
                  </button>
                </div>
              </div>
            </>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
