  function isStraight(st) {
    if (st.length < 2) return true;
    const a = st[0], b = st[st.length - 1], dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    let path = 0, maxd = 0;
    for (let i = 1; i < st.length; i++) {
      path += Math.hypot(st[i].x - st[i - 1].x, st[i].y - st[i - 1].y);
      if (L >= 1) { const d = Math.abs((st[i].x - a.x) * dy - (st[i].y - a.y) * dx) / L; if (d > maxd) maxd = d; }
    }
    if (L < 1) return path < 3;
    return maxd < L * 0.12 && path < L * 1.2;
  }
  function countHoles(img) {
    const W = 28, ink = new Uint8Array(784), seen = new Uint8Array(784);
    for (let i = 0; i < 784; i++) ink[i] = img[i] > 0.3 ? 1 : 0;
    const fill = s => {
      const stack = [s]; seen[s] = 1; let n = 0;
      while (stack.length) {
        const i = stack.pop(), x = i % W, y = (i / W) | 0; n++;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= W) continue;
          const j = ny * W + nx; if (!seen[j] && !ink[j]) { seen[j] = 1; stack.push(j); }
        }
      }
      return n;
    };
    for (let k = 0; k < W; k++) for (const i of [k, (W - 1) * W + k, k * W, k * W + W - 1]) if (!seen[i] && !ink[i]) fill(i);
    let holes = 0;
    for (let i = 0; i < 784; i++) if (!seen[i] && !ink[i] && fill(i) >= 2) holes++;
    return holes;
  }
  function hasTopBar(img) {
    let x0 = 28, x1 = -1, y0 = 28, y1 = -1;
    for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) if (img[y * 28 + x] > 0.3) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    if (x1 < 0) return false;
    const yTop = y0 + Math.max(1, Math.round((y1 - y0) * 0.2));
    let a = 28, b = -1;
    for (let y = y0; y <= yTop; y++) for (let x = 0; x < 28; x++) if (img[y * 28 + x] > 0.3) { a = Math.min(a, x); b = Math.max(b, x); }
    return (b - a + 1) / (x1 - x0 + 1) >= 0.45;
  }
  // 1つの字を読む
  function read(g) {
    const { img, size } = rasterize(g), raw = predict(img);
    let p = raw.slice();
    // 長いまっすぐな縦線が別の画として入っている字は 0・2・3・6・8 ではない（4 や 9 を 8 などと読み違えないように）
    if (g.length >= 2) {
      let gy0 = Infinity, gy1 = -Infinity;
      for (const st of g) for (const q of st) { gy0 = Math.min(gy0, q.y); gy1 = Math.max(gy1, q.y); }
      const gh = gy1 - gy0;
      const longV = g.some(st => {
        if (!isStraight(st)) return false;
        const a = st[0], b = st[st.length - 1];
        return Math.abs(b.x - a.x) <= 0.4 * Math.abs(b.y - a.y) && Math.abs(b.y - a.y) >= 0.6 * gh;
      });
      if (longV) {
        for (const d of [0, 2, 3, 6, 8]) p[d] = 0;
        const sum = p.reduce((a, b) => a + b, 0);
        p = sum > 1e-12 ? p.map(v => v / sum) : raw.slice();
      }
    }
    const top = p.indexOf(Math.max(...p));
    const order = p.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]).slice(0, 3);
    // 1本のまっすぐな線で縦でないもの（5や7の横棒、4の斜め線など）は、数字ではなく字のかけら
    let frag = false;
    if (g.length === 1 && isStraight(g[0])) {
      const a = g[0][0], b = g[0][g[0].length - 1];
      frag = Math.abs(b.x - a.x) > 0.6 * Math.abs(b.y - a.y);
    }
    return { g, img, size, top, conf: p[top], order, p, frag, rawTop: raw.indexOf(Math.max(...raw)), loopless: [0, 6, 8, 9].includes(top) && countHoles(img) === 0,
             bar: top !== 5 || hasTopBar(img), partial4: top === 4 && g.length === 1 };
  }
  // 書き途中の字が、画を書き足すと何になりうるか
  function canBecome(x) {
    const n = x.g.length, last = x.g[n - 1], s = new Set();
    if (n >= 3) return s;
    if (n === 1 && isStraight(last)) [1, 4, 5, 7].forEach(d => s.add(d));
    if (x.loopless && x.top === 6) { s.add(4); s.add(6); }
    if (x.loopless && x.top !== 6) s.add(x.top);
    if (x.top === 0 && !x.loopless) { s.add(9); s.add(8); }
    if (x.top === 5) s.add(5);
    if (x.top === 1) [4, 7].forEach(d => s.add(d));
    if (x.partial4) s.add(4);
    return s;
  }
  // いま書いている字に2画目が来そうか
  function needsWait(list, waitSet) {
    const last = list[list.length - 1];
    const g = segment(list).find(g => g.includes(last));
    if (g.length > 2) return false;
    const r = read(g);
    if (r.loopless || r.partial4) return true;
    if (r.top === 5 && r.bar) return false;   // 横棒まで書いた5は書き終わり
    return waitSet.includes(r.top) || (g.length === 1 && isStraight(last));
  }
  window.HWR = { predict, rasterize, segment, isStraight, countHoles, hasTopBar, read, canBecome, needsWait };
} catch (err) { console.error('手書き判定の準備に失敗', err); window.HWR = null; } })();
  </script>

    function playTone(freq, type="sine", duration=0.12, vol=0.15, delay=0) {
      if (!isSoundEnabled) return;
      try {
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = type; osc.frequency.value = freq;
        const t = ctx.currentTime + delay;
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.start(t); osc.stop(t + duration);
      } catch {}
    }

    const DigitKeypad = ({ onAnswer, typed, isMini, locked }) => {
      const size=isMini?46:58, fs=isMini?'1.5rem':'1.9rem';
      return (
        <div className="digit-row-container" style={{gap:isMini?10:16, ...(locked?{pointerEvents:"none",opacity:0.45}:{})}}>
          {[[1,2,3,4,5],[6,7,8,9,0]].map((row,ri)=>(
            <div key={ri} className="digit-row" style={{gap:isMini?8:10}}>
              {row.map(d=>(
                <button key={d}
                  onPointerDown={(e)=>{e.preventDefault();playDigit();onAnswer(typed+d);}}
                  className="digit-button" style={{width:size,height:size,fontSize:fs}}>
                  {d}
                </button>
              ))}
            </div>
          ))}
        </div>
      );
    };

    // ─── 手書き設定（ふたりとも共通・端末に保存） ───
    const HW_DEFAULT = { enabled:false, delay:50, delay2:1000, thr:85, optAnswer:true, optOverlap:true, waitSet:[1,5] };
    const HW_KEY = "tenchallenge-handwriting";
    // それぞれの数字を書くときの最大の画数（これより少ないうちは、書き途中とみなして待てる）
    const MAX_STROKES = { 0:2, 1:2, 2:2, 3:2, 4:3, 5:3, 6:1, 7:2, 8:2, 9:3 };
    // 取り違えやすい数字の組（小さい方×10＋大きい方）。答えの字が候補に出ていれば答えとみなす
    // 答えの字を書いている途中（1画目など）で、AIが出しがちな読み。これが出たら×にせず次の画を待つ
    // 例：4は縦線から書くと「1」、∠から書くと「6」（細く書くと「2」）。7は1の部分から書くと「1」、横棒からだと「4」
    const PARTIAL_READS = { 0:[1,6], 1:[], 2:[7], 3:[2,7], 4:[1,2,6], 5:[1,4,7], 6:[], 7:[1,4], 8:[0,2,3,5,9], 9:[0,1,6] };
    const CONFUSABLE = new Set([38, 49, 17, 6, 56, 48, 89, 27, 35, 46]);
    function loadHw() {
      try { return { ...HW_DEFAULT, ...JSON.parse(localStorage.getItem(HW_KEY)||"{}") }; } catch { return { ...HW_DEFAULT }; }
    }
    function saveHw(hw) { try { localStorage.setItem(HW_KEY, JSON.stringify(hw)); } catch {} }
    // 答え方（ボタン／てがき）はプレイヤーごと。ひとりで遊ぶときは1Pの設定を使う
    const INPUT_KEY = "tenchallenge-input";
    function loadInputs() {
      try {
        const saved = JSON.parse(localStorage.getItem(INPUT_KEY)||"null");
        if (saved) return { p1: saved.p1 || "button", p2: saved.p2 || "button" };
      } catch {}
      return { p1:"button", p2:"button" };   // はじめはボタン
    }
    // ハンデ：間違え許容（ふたりで遊ぶとき、まちがえても点が下がらない）
    const TOL_KEY = "tenchallenge-tolerance";
    function loadTol() {
      try { const t = JSON.parse(localStorage.getItem(TOL_KEY)||"null"); if (t) return { p1:!!t.p1, p2:!!t.p2 }; } catch {}
      return { p1:false, p2:false };
    }

    // ─── オプションウインドウ ───
    const OptionsWindow = ({ inputs, setInputs, tol, setTol, onOpenHw, onClose, palette }) => {
      // 1P・2Pを1行に並べたトグル
      // どちらが良いというものではないので、色はつけない
      const pairRow = (vals, setVals, labelOf, next) => (
        <div className="opt-pair">
          {[["p1","1P"],["p2","2P"]].map(([k,pl])=>(
            <React.Fragment key={k}>
              <span className="opt-p">{pl}</span>
              <button className="opt-tog"
                onPointerDown={e=>{e.preventDefault();playClick();setVals(o=>({ ...o, [k]:next(o[k]) }));}}>
                {labelOf(vals[k])}
              </button>
            </React.Fragment>
          ))}
        </div>
      );
      return (
        <div className="hw-modal-bg" onTouchStart={e=>e.stopPropagation()} onTouchEnd={e=>e.stopPropagation()} onPointerDown={e=>{ if (e.target===e.currentTarget) onClose(); }}>
          <div className="hw-modal">
            <div className="hw-modal-head">
              <h2>⚙️ オプション</h2>
              <button className="hw-close" onPointerDown={e=>{e.preventDefault();playClick();onClose();}}>✕</button>
            </div>

            <div className="hw-section" style={{marginTop:0}}>ハンデ</div>
            <div className="opt-sub">間違え許容<small>ふたりで遊ぶとき、まちがえたら点をさげるか</small></div>
            {pairRow(tol, setTol, v=>v?"さげない":"さげる", v=>!v)}

            <div className="hw-section">入力方法</div>
            {pairRow(inputs, setInputs, v=>v==="hand"?"✍️ 手書き":"🔢 ボタン", v=>v==="hand"?"button":"hand")}
            <p className="hw-note" style={{marginTop:6}}>ひとりで遊ぶときは1Pの設定になります。</p>

            <div className="hw-section">手書きの設定</div>
            <button className="hw-clear" style={{marginTop:0}} onPointerDown={e=>{e.preventDefault();playClick();onOpenHw();}}>✍️ 手書きの設定・ためし書き</button>

            <button className="hw-back" style={{background:palette.accentGrad}} onPointerDown={e=>{e.preventDefault();playClick();onClose();}}>ゲームへもどる</button>
          </div>
        </div>
      );
    };

    // ─── 手書き入力欄 ───
    // answer: 答え（null なら答えなしの試し書き）／typed: いままでに入った数字
    // onDigits(入力全体の文字列): 読めた数字を足した入力を渡す／disabled: ○×表示中（その間は確定を待つ）
    const HandwritingPad = ({ answer, typed, onDigits, disabled, locked, hw, height, rotated, accent, onRead }) => {
      const canvasRef = useRef(null);
      const st = useRef({ strokes:[], kept:[], cur:null, curId:null, timer:null, waitingDerive:false, pending:"" });
      const live = useRef({});
      live.current = { answer, typed, onDigits, disabled, locked, hw, onRead };
      const [flash, setFlash] = useState(null);
      const flashTimer = useRef(null);

      const showFlash = (text, color) => {
        setFlash({ text, color, k:Date.now() });
        clearTimeout(flashTimer.current);
        flashTimer.current = setTimeout(()=>setFlash(null), 450);
      };

      const redraw = () => {
        const c = canvasRef.current; if (!c) return;
        const ctx = c.getContext("2d"), w = c.clientWidth, h = c.clientHeight;
        ctx.clearRect(0,0,w,h);
        // けたの区切り（目安。判定はどこに書いてもよい）
        const n = live.current.answer==null ? 0 : String(live.current.answer).length;
        if (n > 1) {
          ctx.save(); ctx.strokeStyle = accent; ctx.globalAlpha = 0.35; ctx.lineWidth = 2; ctx.setLineDash([6,7]);
          for (let i=1;i<n;i++) { const x = Math.round(w*i/n)+0.5; ctx.beginPath(); ctx.moveTo(x,12); ctx.lineTo(x,h-12); ctx.stroke(); }
          ctx.restore();
        }
        ctx.lineWidth = Math.max(6, h/20); ctx.lineCap = "round"; ctx.lineJoin = "round";
        // 合っていた字（判定には使わない）
        ctx.save(); ctx.strokeStyle = accent; ctx.globalAlpha = 0.5;
        for (const g of st.current.kept) for (const s of g) {
          ctx.beginPath(); s.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
          if (s.length===1) ctx.lineTo(s[0].x+0.1, s[0].y);
          ctx.stroke();
        }
        ctx.restore();
        ctx.strokeStyle = "#1a1800";
        for (const s of st.current.strokes) {
          ctx.beginPath(); s.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
          if (s.length===1) ctx.lineTo(s[0].x+0.1, s[0].y);
          ctx.stroke();
        }
      };

      useEffect(()=>{
        const c = canvasRef.current;
        const fit = () => {
          const dpr = window.devicePixelRatio||1;
          c.width = Math.round(c.clientWidth*dpr); c.height = Math.round(c.clientHeight*dpr);
          c.getContext("2d").setTransform(dpr,0,0,dpr,0,0); redraw();
        };
        fit(); window.addEventListener("resize", fit);
        return ()=>{ window.removeEventListener("resize", fit); clearTimeout(st.current.timer); clearTimeout(flashTimer.current); };
      },[]);
      useEffect(()=>{ redraw(); },[answer]);
      // 「そこまで！」のあとは書けない（書きかけも消す）
      useEffect(()=>{
        if (!locked) return;
        const s = st.current; clearTimeout(s.timer); s.strokes = []; s.cur = null; s.curId = null; redraw();
      },[locked]);
      // 渡した数字が親の typed に反映されたら「未反映ぶん」は空に（続けて確定しても数字を取りこぼさない）
      useEffect(()=>{
        const s = st.current; s.pending = "";
        // 残している字は入力と同じ数まで（まちがいで戻ったら合わせる、次の問題で入力が空になったら消える）
        if (s.kept.length > typed.length) { s.kept = s.kept.slice(0, typed.length); redraw(); }
      },[typed]);

      // いま入力すべき残りの数字（答えなしの試し書きでは null）
      const expectNow = () => {
        const L = live.current;
        return L.answer==null ? null : String(L.answer).slice((L.typed + st.current.pending).length).split("").map(Number);
      };
      // 答えの字として読んでよいか（取り違えやすい組み合わせで、答えの字が候補に少しでも出ていれば答えの字とみなす）
      const matches = (r, want) => {
        if (want==null || r.frag) return false;
        if (r.top===want) return true;
        const a = Math.min(r.top,want), b = Math.max(r.top,want);
        return CONFUSABLE.has(a*10+b) && r.p[want] >= 0.01;
      };
      // 字の分け方を答えに合わせて直す：となり同士をまとめると答えの字になるならまとめる（9を2画で書いたときなど）
      const mergePass = (list, groups, expect) => {
        for (let changed = true; changed && groups.length > 1;) {
          changed = false;
          for (let i = 0; i < groups.length-1; i++) {
            const want = expect[i]; if (want==null) break;
            const tooMany = groups.length > expect.length;
            if (!tooMany && matches(HWR.read(groups[i]), want)) continue;
            const merged = list.filter(st => groups[i].includes(st) || groups[i+1].includes(st));
            if (matches(HWR.read(merged), want)) { groups.splice(i, 2, merged); changed = true; break; }
          }
        }
        return groups;
      };
      // 字の分け方の候補をいくつか作り、答えに合う字が先頭から多くそろう分け方を使う
      //  ・「縦線を左の字にくっつける」ルールあり／なし（9の「丸＋縦線」と、「51」の5と1を見分ける）
      //  ・まっすぐな線（5や7の横棒、4の縦線、1など）を、となりの字に付け替えたもの・ひとり立ちさせたもの
      const groupsFor = (list, expect) => {
        if (!expect) return HWR.segment(list);
        const cache = new Map();
        const rd = g => {
          const key = g.map(st=>list.indexOf(st)).sort((a,b)=>a-b).join(",");
          if (!cache.has(key)) cache.set(key, HWR.read(g));
          return cache.get(key);
        };
        const left = g => Math.min(...g.map(st=>Math.min(...st.map(q=>q.x))));
        const tidy = gs => gs.filter(g=>g.length).map(g=>list.filter(st=>g.includes(st))).sort((a,b)=>left(a)-left(b));
        const score = gs => { let k = 0; while (k < gs.length && expect[k]!=null && matches(rd(gs[k]), expect[k])) k++; return k; };
        const base = [
          mergePass(list, HWR.segment(list), expect),
          mergePass(list, HWR.segment(list, { noStem:true }), expect),
        ];
        const cands = base.slice();
        for (const gs of base) {
          gs.forEach((g, gi) => g.forEach(st => {
            if (!HWR.isStraight(st)) return;
            gs.forEach((h, hi) => {
              if (hi===gi) return;
              cands.push(tidy(gs.map((x,k)=> k===gi ? x.filter(q=>q!==st) : k===hi ? [...x, st] : x)));
            });
            if (g.length > 1) cands.push(tidy([...gs.map((x,k)=> k===gi ? x.filter(q=>q!==st) : x), [st]]));
          }));
        }
        let best = cands[0], bs = score(best);
        for (const c of cands) { const v = score(c); if (v > bs) { best = c; bs = v; } }
        return best;
      };
      const boxOf = g => {
        let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
        for (const st of g) for (const q of st) { x0=Math.min(x0,q.x); x1=Math.max(x1,q.x); y0=Math.min(y0,q.y); y1=Math.max(y1,q.y); }
        return { x0, x1, y0, y1 };
      };

      // 読んで数字を渡す
      const processGroups = (groups) => {
        const L = live.current, s = st.current, h = canvasRef.current ? canvasRef.current.clientHeight : 200;
        const expect = expectNow();
        const reads = groups.map(g=>HWR.read(g)).filter(r=>r.size >= h*0.08 && !r.frag);   // 字のかけらは読まない
        if (!reads.length) return;
        let digits = "", lastG = null, keepOk = true;
        const keepAdd = [];
        for (let i = 0; i < reads.length; i++) {
          const r = reads[i], want = expect ? expect[i] : null;
          if (matches(r, want)) { digits += want; lastG = r.g; if (keepOk) keepAdd.push(r.g); continue; }
          if (r.conf < L.hw.thr/100) { showFlash("？","#b07a10"); break; }   // 自信がひくい → ×にせず書き直し
          digits += r.top; lastG = r.g; keepOk = false;   // まちがえた字とそのあとは残さない
        }
        if (L.onRead) L.onRead(reads);
        if (digits) {
          const b = boxOf(lastG);
          s.lastBox = { ...b, t: performance.now() };   // 確定した字のあとから書き足した「かけら」を見分けるため
          const full = L.typed + s.pending + digits;
          s.pending += digits; playDigit();
          // 答えのけた数まで書けたら：直後に書いた画は「さっきの字の書き足し」とみなして使わない
          // （正解なら0.5秒、まちがいなら0.3秒。新しい問題に前の字の続きが入ってミスになるのを防ぐ）
          const ans = L.answer==null ? null : String(L.answer);
          // 合っていた字は表示を残す（正解で答えがそろったら全部消す）
          if (ans && full===ans) s.kept = [];
          else if (ans) s.kept.push(...keepAdd);
          redraw();
          if (ans && full.length >= ans.length) {
            s.ignoreUntil = performance.now() + (full===ans ? 500 : 300);
            s.strokes = []; clearTimeout(s.timer); redraw();
          }
          L.onDigits(full);
        }
      };
      const commitNow = () => {
        const s = st.current;
        clearTimeout(s.timer);
        if (!s.strokes.length) return;
        if (live.current.disabled) { s.timer = setTimeout(commitNow, 50); return; }   // ○×表示中は待つ
        const list = s.strokes; s.strokes = []; s.waitingDerive = false; redraw();
        processGroups(groupsFor(list, expectNow()));
      };

      const decide = () => {
        const s = st.current, L = live.current, hw = L.hw;
        const last = s.strokes[s.strokes.length-1];
        const expect = expectNow();
        // 確定したばかりの字に重なる、背の低いまっすぐな線（2の下の横棒・7や1の飾りなど）は、その字の書き足しとして捨てる
        if (s.strokes.length===1 && s.lastBox && performance.now() - s.lastBox.t < 1500 && HWR.isStraight(last)) {
          const b = s.lastBox, k = boxOf([last]), bh = b.y1 - b.y0;
          const ov = Math.min(b.x1, k.x1) - Math.max(b.x0, k.x0);
          if (k.y1 - k.y0 <= bh * 0.35 && ov >= (k.x1 - k.x0) * 0.4 && k.y0 >= b.y0 - bh*0.2 && k.y1 <= b.y1 + bh*0.2) {
            s.strokes = []; redraw(); return;
          }
        }
        // 重ね書き：曲がった画が前の字に重なったら新しい字（答えの字や4・5・7になるなら続きの画）
        if (hw.optOverlap && s.strokes.length>=2 && !HWR.isStraight(last)) {
          const segs = groupsFor(s.strokes, expect), g = segs.find(g=>g.includes(last));
          if (g.length >= 2) {
            const r = HWR.read(g), want = expect ? expect[segs.indexOf(g)] : null;
            if (!matches(r, want) && !([4,5,7].includes(r.top) && r.conf>=0.7)) {
              const prev = s.strokes.slice(0,-1);
              if (!L.disabled) { s.strokes = [last]; redraw(); processGroups(groupsFor(prev, expect)); }
            }
          }
        }
        // 答えとけた数を使った判定
        let wait2 = false;
        s.waitingDerive = false;
        const exp2 = expectNow();
        if (exp2 && hw.optAnswer) {
          const info = groupsFor(s.strokes, exp2).map(g=>HWR.read(g));
          const cur = info.findIndex(x=>x.g.includes(last));
          if (info.length > exp2.length || info.some((x,i)=> i!==cur && !matches(x, exp2[i]))) return commitNow();   // 即×
          const x = info[cur], want = exp2[cur];
          // 即正解は、AIの1番目の読みが答えの字そのもののときだけ（取り違えやすい組での「答えとみなす」は、
          // 書き終わりを待ってから使う。書き途中の画が答えとみなされて先に正解になるのを防ぐ）
          // 指をはなした瞬間にAIが答えの字と読んだら正解
          // ただし、ふつう2画以上で書く字は書き終わりを待つ（5は上の横棒、4は2画目まで。1画で止めたら待ち時間のあと正解）
          const unfinished = (x.top===5 && !x.bar) || (x.top===4 && x.g.length < 2);
          const asWritten = x.top===want && !unfinished && !x.frag;
          if (asWritten && info.length===exp2.length) return commitNow();   // 即正解
          if (!asWritten) {
            // 答えの字を書く途中でAIが出しがちな読みで、まだ画を書き足せる数なら、次の画を待つ。それ以外は即×
            const room = x.g.length < (MAX_STROKES[want] || 1);
            // 1番目の読みが書き途中にありがちな数字か、それらや答えの字が候補に15%以上出ていれば「書き途中」
            const pr = PARTIAL_READS[want] || [];
            const partial = x.frag || pr.includes(x.top) || (x.top===want && unfinished) || [...pr, want].some(d => x.p[d] >= 0.15);
            if (!room || !partial) return commitNow();   // 即×
            wait2 = true; s.waitingDerive = true;
          }
        }
        let wait = hw.delay;
        if (wait2 || HWR.needsWait(s.strokes, hw.waitSet)) wait = Math.max(wait, hw.delay2);
        s.timer = setTimeout(commitNow, wait);
      };

      const pt = (e) => {
        const c = canvasRef.current, r = c.getBoundingClientRect();
        let x = e.clientX - r.left, y = e.clientY - r.top;
        if (rotated) { x = r.width - x; y = r.height - y; }   // 上下さかさまの2P側
        return { x, y };
      };
      const onDown = (e) => {
        e.preventDefault(); e.stopPropagation();
        const s = st.current; if (s.cur) return;   // 指1本だけ
        if (live.current.locked) return;
        if (s.ignoreUntil && performance.now() < s.ignoreUntil) { s.ignoreId = e.pointerId; return; }   // 答えが決まった直後の画は使わない
        clearTimeout(s.timer);
        const hw = live.current.hw;
        // 前の字が書き終わった形なら、次の画を書き始めた瞬間に確定
        if (hw.optOverlap && s.strokes.length && !s.waitingDerive && !HWR.needsWait(s.strokes, hw.waitSet)) commitNow();
        s.waitingDerive = false;
        try { canvasRef.current.setPointerCapture(e.pointerId); } catch {}
        s.cur = [pt(e)]; s.curId = e.pointerId; s.strokes.push(s.cur); redraw();
      };
      const onMove = (e) => {
        const s = st.current; if (!s.cur || e.pointerId!==s.curId) return;
        e.preventDefault();
        const co = e.nativeEvent.getCoalescedEvents ? e.nativeEvent.getCoalescedEvents() : [];
        for (const ev of (co.length?co:[e])) s.cur.push(pt(ev));
        redraw();
      };
      const onUp = (e) => {
        const s = st.current;
        if (s.ignoreId===e.pointerId) { s.ignoreId = null; return; }
        if (!s.cur || e.pointerId!==s.curId) return;
        s.cur = null; s.curId = null; decide();
      };

      return (
        <div className="hw-pad" style={{height, ...(locked?{opacity:0.45}:{})}}>
          <canvas ref={canvasRef} className="hw-canvas"
            onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}/>
          {flash && <div key={flash.k} className="hw-flash" style={{color:flash.color}}>{flash.text}</div>}
        </div>
      );
    };

    // 判定に使った28×28の画像を表示
    const SeenImg = ({ img }) => {
      const ref = useRef(null);
      useEffect(()=>{
        const c = ref.current.getContext("2d"), d = c.createImageData(28,28);
        for (let i=0;i<784;i++){ const v=Math.round(img[i]*255); d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v; d.data[i*4+3]=255; }
        c.putImageData(d,0,0);
      },[img]);
      return <canvas ref={ref} width={28} height={28} className="hw-seen-img"/>;
    };

    // ─── 手書きの設定ウインドウ（試し書きつき） ───
    const HandwritingSettings = ({ hw, setHw, onClose, palette }) => {
      const [trial, setTrial] = useState("");
      const [lastConf, setLastConf] = useState(null);
      const [lastReads, setLastReads] = useState([]);
      const [padKey, setPadKey] = useState(0);
      // ためし書きの「おだい」：ゲームと同じように答えを使って判定する
      const randTarget = () => String(Math.random()<0.35 ? 1+Math.floor(Math.random()*9) : 10+Math.floor(Math.random()*90));
      const [trialMode, setTrialMode] = useState("quiz");
      const [target, setTarget] = useState(randTarget);
      const [typedT, setTypedT] = useState("");
      const [fbT, setFbT] = useState(null);
      const onQuizDigits = v => {
        if (v===target) {
          playCorrect(); setTypedT(v); setFbT("correct");
          setTimeout(()=>{ setFbT(null); setTypedT(""); setTarget(randTarget()); },500);
        } else if (!target.startsWith(v)) {
          playWrong(); setTypedT(v); setFbT("wrong");
          setTimeout(()=>{ setFbT(null); setTypedT(""); },700);
        } else setTypedT(v);
      };
      const set = (k,v) => setHw(h=>({ ...h, [k]:v }));
      const slider = ({ k, label, min, max, step, fmt, note }) => (
        <label className="hw-set">
          <span>{label}</span><b>{fmt(hw[k])}</b>
          <input type="range" min={min} max={max} step={step} value={hw[k]}
            onChange={e=>set(k, +e.target.value)} style={{accentColor:palette.accent}}/>
          {note && <small>{note}</small>}
        </label>
      );
      const sec = v => (v/1000).toFixed(2)+"秒";
      return (
        <div className="hw-modal-bg" onTouchStart={e=>e.stopPropagation()} onTouchEnd={e=>e.stopPropagation()} onPointerDown={e=>{ if (e.target===e.currentTarget) onClose(); }}>
          <div className="hw-modal">
            <div className="hw-modal-head">
              <h2>✍️ 手書きの設定</h2>
              <button className="hw-close" onPointerDown={e=>{e.preventDefault();playClick();onClose();}}>✕</button>
            </div>

            <div className="hw-section" style={{marginTop:0}}>ためし書き</div>
            <div className="hw-tabs">
              {[["quiz","おだい（ゲームと同じ判定）"],["free","じゆうに書く"]].map(([m,l])=>(
                <button key={m} aria-pressed={trialMode===m} style={trialMode===m?{background:palette.accent,color:"white"}:{}}
                  onPointerDown={e=>{e.preventDefault();playClick();setTrialMode(m);setTrial("");setTypedT("");setFbT(null);setPadKey(k=>k+1);}}>{l}</button>
              ))}
            </div>
            {trialMode==="quiz"
              ? <div className={`hw-quiz ${fbT||""}`}>
                  <span>おだい</span><b>{target}</b>
                  <span>かいた：<b className="typed">{typedT||"　"}</b>{fbT==="correct"?" ⭕":fbT==="wrong"?" ❌":""}</span>
                </div>
              : <div className="hw-trial-read">
                  よんだ数字：<b>{trial || "—"}</b>
                  {lastConf!=null && <span>（自信 {lastConf}%）</span>}
                </div>}
            <HandwritingPad key={padKey} hw={hw} height={170} accent={palette.accent}
              answer={trialMode==="quiz"?target:null} typed={trialMode==="quiz"?typedT:""} disabled={!!fbT}
              onDigits={trialMode==="quiz"?onQuizDigits:(v=>setTrial(v.slice(-10)))}
              onRead={reads=>{ setLastConf(Math.round(Math.min(...reads.map(r=>r.conf))*100)); setLastReads(reads.map(r=>({ img:r.img, order:r.order, n:r.g.length, k:Math.random() }))); }}/>
            {lastReads.length>0 && (
              <div className="hw-seen">
                {lastReads.map(r=>(
                  <div key={r.k} className="hw-seen-item">
                    <SeenImg img={r.img}/>
                    <div><b>{r.order[0][1]}</b>（{Math.round(r.order[0][0]*100)}%）<br/>
                      <span>次点 {r.order[1][1]}（{Math.round(r.order[1][0]*100)}%）・{r.n}画</span></div>
                  </div>
                ))}
              </div>
            )}
            <button className="hw-clear" onPointerDown={e=>{e.preventDefault();playClick();setTrial("");setLastConf(null);setTypedT("");setFbT(null);if(trialMode==="quiz")setTarget(randTarget());setPadKey(k=>k+1);}}>{trialMode==="quiz"?"つぎのおだい":"けす"}</button>

            <div className="hw-section">判定のタイミング</div>
            {slider({ k:"delay", label:"判定までの時間", min:0, max:1000, step:50, fmt:sec,
              note:"手をはなしてから判定を始めるまでの時間です。" })}
            {slider({ k:"delay2", label:"2画目を待つ時間", min:200, max:2000, step:50, fmt:sec,
              note:"4・5・7など、2画目が来そうな形のときはこの時間まで待ちます。" })}
            {slider({ k:"thr", label:"自信の下限", min:0, max:95, step:5, fmt:v=>v+"%",
              note:"判定の自信がこれより低いと×にせず「？」を出して書き直してもらいます。" })}
            <label className="hw-check"><input type="checkbox" checked={hw.optAnswer} onChange={e=>set("optAnswer",e.target.checked)} style={{accentColor:palette.accent}}/>答えを使って判定を早める（即正解・即×）</label>
            <label className="hw-check"><input type="checkbox" checked={hw.optOverlap} onChange={e=>set("optOverlap",e.target.checked)} style={{accentColor:palette.accent}}/>重ね書きを見分ける</label>
            <button className="hw-reset" onPointerDown={e=>{e.preventDefault();playClick();setHw({ ...HW_DEFAULT });}}>はじめの設定にもどす</button>
            <button className="hw-back" style={{background:palette.accentGrad}} onPointerDown={e=>{e.preventDefault();playClick();onClose();}}>もどる</button>
          </div>
        </div>
      );
    };

    const GamePanel = ({ isMini, feedback, current, onAnswer, typed, hw, hand, locked, rotated, accent }) => {
      if (!current) return null;
      const parts=current.question.split("?");
      return (
        <div className="game-panel">
          <div className={`q-box ${feedback||""}`}
            style={{padding:isMini?"14px 18px":"22px 28px",marginBottom:isMini?"14px":"28px"}}>
            <div className="q-text" style={{fontSize:isMini?"1.9rem":"2.5rem"}}>
              {parts[0]}
              <span className="ans-slot" style={{
                color:
                  feedback==="correct"?"#1a6b2a":
                  feedback==="wrong"  ?"#a82020":
                  typed               ?"#b04a08":
                  "rgba(50,35,0,0.32)",
                borderColor:
                  feedback==="correct"?"#1a6b2a":
                  feedback==="wrong"  ?"#a82020":
                  typed               ?"#b04a08":
                  "rgba(50,35,0,0.25)"
              }}>
                {typed||(feedback==="correct"?current.answer:"?")}
              </span>
              {parts[1]}
            </div>
            {feedback&&(
              <div className="feedback-container">
                <div className={`fb-icon ${feedback==="correct"?"fb-pop":"fb-shake"}`}>
                  {feedback==="correct"?"✓":"✕"}
                </div>
              </div>
            )}
          </div>
          {hand
            ? <HandwritingPad answer={current.answer} typed={typed} hw={hw} rotated={rotated} accent={accent}
                height={isMini?150:210} disabled={!!feedback} locked={locked} onDigits={v=>onAnswer(v)}/>
            : <DigitKeypad onAnswer={onAnswer} typed={typed} isMini={isMini} locked={locked}/>}
        </div>
      );
    };

    // contained：その場所の中だけに降らせる（対戦のクリアの帯の後ろ）
    const Confetti = ({ contained }) => {
      const pieces=useRef([...Array(55)].map((_,i)=>{
        const colors=['#e8709a','#e8983a','#d4b830','#4aaa62','#4a90c8','#8a70d0','#80c040','#e06858'];
        const dur=3.5+Math.random()*4;
        return {
          id:i, x:Math.random()*100, size:7+Math.random()*8,
          color:colors[i%colors.length],
          delay:-Math.random()*dur, duration:dur,
          rotate:Math.random()*360, shape:Math.random()>0.5?'50%':'3px'
        };
      })).current;
      return (
        <div style={contained
            ? {position:'absolute',inset:0,pointerEvents:'none',zIndex:0,overflow:'hidden'}
            : {position:'fixed',inset:0,pointerEvents:'none',zIndex:900,overflow:'hidden'}}>
          {pieces.map(p=>(
            <div key={p.id} className={contained?"confetti-in":"confetti"} style={{
              left:p.x+'%',width:p.size,height:p.size,
              backgroundColor:p.color,borderRadius:p.shape,
              animationDelay:p.delay+'s',animationDuration:p.duration+'s',
              transform:`rotate(${p.rotate}deg)`
            }}/>
          ))}
        </div>
      );
    };

    const TimerRing = ({ time, max, isAddSub }) => {
      const r=36, circ=2*Math.PI*r, pct=time/max;
      const color=pct>0.5?(isAddSub?'#2e7d46':'#2563a8'):pct>0.25?'#b07a10':'#a83030';
      return (
        <div style={{position:'relative',width:90,height:90,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="90" height="90" style={{position:'absolute',transform:'rotate(-90deg)'}}>
            <circle cx="45" cy="45" r={r} fill="none" stroke="rgba(0,0,0,0.09)" strokeWidth="7"/>
            <circle cx="45" cy="45" r={r} fill="none" stroke={color} strokeWidth="7"
              strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
              style={{transition:'stroke-dashoffset 0.9s linear,stroke 0.5s'}} strokeLinecap="round"/>
          </svg>
          <span style={{color,fontSize:'1.8rem',fontWeight:900,zIndex:1,transition:'color 0.5s'}}>{time}</span>
        </div>
      );
    };

    function App() {
      const [mainMode,   setMainMode]   = useState("addSub");
      const [screen,     setScreen]     = useState("top");
      const [soundOn,    setSoundOn]    = useState(false);
      const [soloLevel,  setSoloLevel]  = useState(1);
      const [soloOp,     setSoloOp]     = useState("add");
      const [soloScore,  setSoloScore]  = useState(0);
      const [soloTime,   setSoloTime]   = useState(0);
      const [soloFinish, setSoloFinish] = useState(false);
      const [deathReset, setDeathReset] = useState(0);
      const [soloName,   setSoloName]   = useState("プレイヤー1");
      const [countdown,  setCountdown]  = useState(3);
      const [q1,  setQ1]  = useState(null);
      const [fb1, setFb1] = useState(null);
      const [typed1, setTyped1] = useState("");
      const [p1Name,  setP1Name]  = useState("プレイヤー1");
      const [p2Name,  setP2Name]  = useState("プレイヤー2");
      const [p1Level, setP1Level] = useState(1);
      const [p2Level, setP2Level] = useState(1);
      const [p1Op,    setP1Op]    = useState("add");
      const [p2Op,    setP2Op]    = useState("add");
      const [p1Score, setP1Score] = useState(0);
      const [p2Score, setP2Score] = useState(0);
      const [duoGoal, setDuoGoal] = useState(10);
      const [winner,  setWinner]  = useState(null); // ★修正: 名前ではなくプレイヤー番号(1/2)で持つ
      const [q2,  setQ2]  = useState(null);
      const [fb2, setFb2] = useState(null);
      const [typed2, setTyped2] = useState("");
      const [p1Ready,setP1Ready] = useState(false);
      const [p2Ready,setP2Ready] = useState(false);
      const [soloKb, setSoloKb] = useState(false);
      const [p1Kb,   setP1Kb]   = useState(false);
      const [p2Kb,   setP2Kb]   = useState(false);
      const [hw,     setHw]     = useState(loadHw);
      const [inputs, setInputs] = useState(loadInputs);
      const setInput = k => v => setInputs(o=>({ ...o, [k]:v }));
      const [modal,  setModal]  = useState(null);   // null / "options" / "hw"
      const [tol,    setTol]    = useState(loadTol);
      // 対戦は1つの画面で進める：setup（えらぶ）→ countdown → game → over（けっか）
      const [duoPhase, setDuoPhase] = useState("setup");
      const [duoView,  setDuoView]  = useState({1:"setup",2:"setup"});
      const [resOpen,  setResOpen]  = useState({1:false,2:false});
      const overAt = useRef(0);
      const touchStartX   = useRef(0);
      const finalScoreRef = useRef(0);

      // ─── 予約タイマー管理 ───
      // ★修正: 途中でメニューから抜けても、カウントダウンや結果画面への遷移が後から割り込まないようにする
      const pendingRef = useRef(new Set());
      const later = (fn,ms) => {
        const id=setTimeout(()=>{ pendingRef.current.delete(id); fn(); },ms);
        pendingRef.current.add(id); return id;
      };
      const every = (fn,ms) => {
        const id=setInterval(fn,ms);
        pendingRef.current.add(id); return id;
      };
      const clearPending = () => {
        pendingRef.current.forEach(id=>{ clearTimeout(id); clearInterval(id); });
        pendingRef.current.clear();
      };

      const isAddSub = mainMode === "addSub";
      useEffect(()=>{ saveHw(hw); },[hw]);
      useEffect(()=>{ try { localStorage.setItem(INPUT_KEY, JSON.stringify(inputs)); } catch {} },[inputs]);
      useEffect(()=>{ try { localStorage.setItem(TOL_KEY, JSON.stringify(tol)); } catch {} },[tol]);
      // サドンデスは常にレベル1・たし算（かけ算）から開始し、10問ごとにレベルアップ
      const deathLevel = (s) => Math.min(4, Math.floor(s/10)+1);
      const deathOp = isAddSub ? "add" : "mul";

      // ─── カラーパレット ───
      const palette = isAddSub ? {
        bgGrad:      'linear-gradient(145deg, #d0ecd8 0%, #a8d8b8 35%, #7ec49a 65%, #58b080 100%)',
        accent:      '#2e7d46',
        accentDark:  '#1e5c32',
        accentGrad:  'linear-gradient(135deg,#4a9e62,#2e7d46)',
        accentShadow:'rgba(46,125,70,0.35)',
        cardBg:      'rgba(255,255,255,0.58)',
        cardBorder:  'rgba(255,255,255,0.80)',
        particle:    'rgba(60,160,90,0.30)',
        headerBg:    'rgba(255,255,255,0.48)',
      } : {
        bgGrad:      'linear-gradient(145deg, #ccdaf5 0%, #a8c0ec 35%, #7aa0e0 65%, #5080cc 100%)',
        accent:      '#2563a8',
        accentDark:  '#1a4880',
        accentGrad:  'linear-gradient(135deg,#4a82c8,#2563a8)',
        accentShadow:'rgba(37,99,168,0.35)',
        cardBg:      'rgba(255,255,255,0.58)',
        cardBorder:  'rgba(255,255,255,0.80)',
        particle:    'rgba(60,100,210,0.28)',
        headerBg:    'rgba(255,255,255,0.48)',
      };

      const glassCard = {
        background:          palette.cardBg,
        backdropFilter:      'blur(20px)',
        WebkitBackdropFilter:'blur(20px)',
        border:              `2px solid ${palette.cardBorder}`,
        borderRadius:        28,
        boxShadow:           '0 8px 32px rgba(0,0,0,0.12)',
      };

      const toggleMainMode = () => { playClick(); setMainMode(p=>p==="addSub"?"mulDiv":"addSub"); };

      // ─── サウンド制御 ───
      const bgmScreen = screen==="duo" ? ((duoPhase==="game"||duoPhase==="countdown") ? "duo-game" : "duo-setup") : screen;
      useEffect(()=>{
        isSoundEnabled=soundOn;
        if (!soundOn) { stopBGM(); return; }
        const t=getBGMType(bgmScreen);
        if (t) playBGM(t,true);
      },[soundOn]);

      useEffect(()=>{
        if (!soundOn) return;
        const t=getBGMType(bgmScreen);
        if (t) playBGM(t); else stopBGM();
      },[bgmScreen]);

      useEffect(()=>{
        const fn=()=>{
          if (document.hidden) { stopBGM(); return; }
          if (soundOn) { const t=getBGMType(bgmScreen); if(t) playBGM(t,true); }
        };
        document.addEventListener("visibilitychange",fn);
        return ()=>document.removeEventListener("visibilitychange",fn);
      },[soundOn,bgmScreen]);

      useEffect(()=>{
        const op=isAddSub?"add":"mul";
        setSoloOp(op); setP1Op(op); setP2Op(op);
      },[mainMode]);

      // ★修正: 両者けってい後に設定を変えても、最新の設定で始まるよう依存に追加
      useEffect(()=>{
        if (screen==="duo"&&(duoPhase==="setup"||duoPhase==="over")&&p1Ready&&p2Ready) {
          const t=setTimeout(()=>startDuo(),500);
          return ()=>clearTimeout(t);
        }
      },[screen,duoPhase,p1Ready,p2Ready,p1Level,p2Level,p1Op,p2Op,mainMode]);

      // ─── タイマー ───
      // ★修正: サドンデスで正解したらインターバル自体を作り直す（以前はゲージだけ5に戻り、実際の残りは4.x秒だった）
      const isSoloGame = screen==="solo-game-time"||screen==="solo-game-death";
      useEffect(()=>{
        if (!isSoloGame||soloFinish) return;
        const itv=setInterval(()=>setSoloTime(p=>Math.max(0,p-1)),1000);
        return ()=>clearInterval(itv);
      },[screen,soloFinish,deathReset]);

      // ★修正: 時間切れ処理を setState の中から外に出す（副作用の二重実行を防止）
      useEffect(()=>{
        if (!isSoloGame||soloFinish) return;
        if (soloTime<=0) {
          stopBGM(); setSoloFinish(true);
          const to=screen==="solo-game-time"?"result-solo-time":"result-solo-death";
          later(()=>setScreen(to),1000);
        } else if (soloTime<=3) {
          playTimeWarn();
        }
      },[soloTime]);

      // ─── 画面遷移 ───
      const resetRoundState = () => {
        clearPending();
        setFb1(null); setFb2(null); setTyped1(""); setTyped2("");
        setP1Ready(false); setP2Ready(false); setWinner(null);
      };
      const navigate = (to) => {
        resetRoundState();
        if (to==="duo") {   // 対戦は「えらぶ」から
          setDuoPhase("setup"); setDuoView({1:"setup",2:"setup"}); setResOpen({1:false,2:false});
          setP1Score(0); setP2Score(0);
        }
        setScreen(to);
      };

      // ─── スタート処理 ───
      const runCountdown = (countdownScreen, onGo) => {
        setCountdown(3); setScreen(countdownScreen);
        let c=3; playCountdown(c);
        const t=every(()=>{
          c--;
          if (c<=0) { clearInterval(t); playCountdown(0); onGo(); }
          else { setCountdown(c); playCountdown(c); }
        },1000);
      };

      const startSoloTime = () => {
        resetRoundState();
        finalScoreRef.current=0;
        setSoloScore(0);
        setSoloTime(TIME_LIMIT_30); setSoloFinish(false);
        runCountdown("solo-countdown-time",()=>{
          setQ1(generateQuestion(soloLevel,soloOp,mainMode)); setScreen("solo-game-time");
        });
      };

      const startSoloDeath = () => {
        resetRoundState();
        finalScoreRef.current=0;
        setSoloScore(0);
        setSoloTime(SUDDEN_DEATH_PER_Q); setSoloFinish(false);
        runCountdown("solo-countdown-death",()=>{
          setQ1(generateQuestion(deathLevel(0),deathOp,mainMode)); setScreen("solo-game-death");
        });
      };

      const startDuo = () => {
        resetRoundState();
        setP1Score(0); setP2Score(0); setP1Kb(false); setP2Kb(false);
        setQ1(generateQuestion(p1Level,p1Op,mainMode));
        setQ2(generateQuestion(p2Level,p2Op,mainMode));
        setDuoView({1:"setup",2:"setup"}); setResOpen({1:false,2:false});
        setCountdown(3); setDuoPhase("countdown");
        let c=3; playCountdown(c);
        const t=every(()=>{
          c--;
          if (c<=0) { clearInterval(t); playCountdown(0); setDuoPhase("game"); }
          else { setCountdown(c); playCountdown(c); }
        },1000);
      };

      // ─── 回答ハンドラ ───
      const handleSoloAnsTime = (v) => {
        if (fb1||soloFinish||!q1) return;
        setTyped1(v);
        if (v===String(q1.answer)) {
          playCorrect(); setFb1("correct");
          const ns=soloScore+1; finalScoreRef.current=ns; setSoloScore(ns);
          later(()=>{ setFb1(null); setTyped1(""); setQ1(q=>generateQuestion(soloLevel,soloOp,mainMode,q.question)); },250);
        } else if (!String(q1.answer).startsWith(v)) {
          playWrong(); setFb1("wrong");
          later(()=>{ setFb1(null); setTyped1(""); },250);
        }
      };

      const handleSoloAnsDeath = (v) => {
        if (fb1||soloFinish||!q1) return;
        setTyped1(v);
        if (v===String(q1.answer)) {
          playCorrect();
          setSoloTime(SUDDEN_DEATH_PER_Q);
          setDeathReset(k=>k+1);
          setFb1("correct");
          const ns=soloScore+1; finalScoreRef.current=ns; setSoloScore(ns);
          later(()=>{
            setFb1(null); setTyped1("");
            setQ1(q=>generateQuestion(deathLevel(ns),deathOp,mainMode,q.question));
          },250);
        } else if (!String(q1.answer).startsWith(v)) {
          playWrong(); setFb1("wrong"); setSoloFinish(true); stopBGM();
          later(()=>setScreen("result-solo-death"),1000);
        }
      };

      // ★修正: ○×表示中の連打を無視（以前は正解直後の連打で誤答扱いになり減点されていた）
      const handleDuoAns = (p,v) => {
        if (winner||screen!=="duo"||duoPhase!=="game") return;
        if ((p===1?fb1:fb2)) return;
        const target=p===1?q1:q2;
        const setT=p===1?setTyped1:setTyped2;
        const setS=p===1?setP1Score:setP2Score;
        const setFb=p===1?setFb1:setFb2;
        const cur=p===1?p1Score:p2Score;
        setT(v);
        if (v===String(target.answer)) {
          playCorrect(); setFb("correct");
          const ns=cur+1; setS(ns);
          if (ns>=duoGoal) {
            setWinner(p); stopBGM(); playWin();
            overAt.current = performance.now();
            setDuoPhase("over"); setDuoView({1:"result",2:"result"}); setResOpen({1:false,2:false});
          } else {
            later(()=>{
              setFb(null); setT("");
              (p===1?setQ1:setQ2)(q=>generateQuestion(
                p===1?p1Level:p2Level,p===1?p1Op:p2Op,mainMode,q.question
              ));
            },250);
          }
        } else if (!String(target.answer).startsWith(v)) {
          playWrong(); setFb("wrong");
          if (!(p===1?tol.p1:tol.p2)) setS(s=>Math.max(0,s-1));   // 間違え許容なら点は下がらない
          later(()=>{ setFb(null); setT(""); },250);
        }
      };

      const goTop = () => {
        resetRoundState();
        stopBGM(); setScreen("top");
        setSoloLevel(1); setDuoGoal(10);
        setSoloKb(false); setP1Kb(false); setP2Kb(false);
      };

      const opOptions = isAddSub
        ? [
            {v:"both",e:<span className="op-group"><span className="op-add">＋</span><span className="op-sub">－</span></span>,l:"りょうほう"},
            {v:"add", e:<span className="op-add">＋</span>,l:"たし算"},
            {v:"sub", e:<span className="op-sub">－</span>,l:"ひき算"}

            .hw-quiz { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-weight:800; font-size:0.85rem; padding:6px 10px; border-radius:12px; background:rgba(0,0,0,0.04); transition:background 0.2s; }
            .hw-quiz > b { font-size:1.8rem; line-height:1; margin-right:auto; }
            .hw-quiz .typed { font-size:1.3rem; letter-spacing:0.06em; }
            .hw-quiz.correct { background:rgba(190,235,205,0.9); }
            .hw-quiz.wrong { background:rgba(245,200,200,0.9); }
            .hw-seen { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
            .hw-seen-item { display:flex; align-items:center; gap:6px; font-size:0.8rem; font-weight:800; background:rgba(0,0,0,0.04); border-radius:10px; padding:4px 8px 4px 4px; }
            .hw-seen-item b { font-size:1.1rem; }
            .hw-seen-item span { font-size:0.7rem; font-weight:700; color:rgba(20,35,0,0.55); }
            .hw-seen-img { width:44px; height:44px; border-radius:6px; image-rendering:pixelated; background:#000; }
            .hw-trial-read { font-weight:800; font-size:0.95rem; margin-bottom:8px; }
            .hw-trial-read b { font-size:1.4rem; letter-spacing:0.08em; margin-left:4px; }
            .hw-trial-read span { font-size:0.8rem; color:rgba(20,35,0,0.55); margin-left:6px; }
            .hw-clear, .hw-reset {
              margin-top:8px; width:100%; border:2px solid rgba(0,0,0,0.10); background:white; border-radius:12px;
              padding:9px; font-weight:900; font-size:0.9rem; cursor:pointer; color:#333;
              font-family:'Nunito','M PLUS Rounded 1c',sans-serif;
            }
            .hw-reset { margin-top:14px; color:rgba(20,35,0,0.6); }
            .hw-set { display:grid; grid-template-columns:1fr auto; gap:2px 10px; font-weight:800; font-size:0.88rem; margin-bottom:12px; }
            .hw-set input { grid-column:1/-1; width:100%; }
            .hw-set small { grid-column:1/-1; font-weight:600; font-size:0.74rem; color:rgba(20,35,0,0.55); line-height:1.5; }
            .hw-check { display:flex; align-items:center; gap:8px; font-weight:800; font-size:0.86rem; margin-bottom:8px; }
            .hw-check input { width:20px; height:20px; flex:none; }

            /* ─── キーフレーム ─── */
            @keyframes cPop {
              0%  { transform:scale(0.6); }
              60% { transform:scale(1.25); }
              100%{ transform:scale(1); }
            }
            @keyframes wShake {
              0%,100%{ transform:translateX(0); }
              25%    { transform:translateX(-7px); }
              75%    { transform:translateX(7px); }
            }
          `}</style>

          {/* ─── 背景パーティクル ─── */}
          {[...Array(8)].map((_,i)=>(
            <div key={i} className="particle" style={{
              width:  40+i*15,
              height: 40+i*15,
              top:    (i*12+5)+'%',
              left:   (i%2?2:87)+'%',
              background: palette.particle,
              animationDelay:    i*0.7+'s',
              animationDuration: (5+i*0.5)+'s'
            }}/>
          ))}

          {/* ─── サウンドボタン ─── */}
          <div style={soundBtnStyle}>
            <button className="se-toggle-btn"
              onPointerDown={()=>{ playClick(); setSoundOn(!soundOn); }}>
              {soundOn?"🎵":"🔇"}
            </button>
          </div>

          <GlobalMenu screen={screen} onNavigate={navigate} onTop={goTop} onOpenOptions={()=>setModal("options")}/>
          {modal==="options" && <OptionsWindow inputs={inputs} setInputs={setInputs} tol={tol} setTol={setTol} palette={palette}
            onOpenHw={()=>setModal("hw")} onClose={()=>setModal(null)}/>}
          {modal==="hw" && <HandwritingSettings hw={hw} setHw={setHw} palette={palette} onClose={()=>setModal("options")}/>}

          {/* ════════════════════════════════
              トップ画面
          ════════════════════════════════ */}
          {screen==="top" && (
            <div style={{textAlign:"center",zIndex:10,display:"flex",flexDirection:"column",alignItems:"center"}}>
              <div style={{
                fontSize:"5.5rem",
                animation:"particle-float 3s ease-in-out infinite",
                marginBottom:8,
                opacity:1
              }}>
                {isAddSub?"🐻":"🐼"}
              </div>
              <h1 className="title-main">
                {isAddSub
                  ? <>たし算<span className="op-add" style={{fontSize:'4.2rem'}}>＋</span><br/>ひき算<span className="op-sub" style={{fontSize:'4.2rem'}}>－</span></>
                  : <>かけ算<span className="op-mul" style={{fontSize:'4.2rem'}}>×</span><br/>わり算<span className="op-div" style={{fontSize:'4.2rem'}}>÷</span></>}
              </h1>
              <p className="title-sub">MATH CHALLENGE</p>

              <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:36}}>
                {[
                  {icon:"🐥",label:"ひとりで",to:"solo-menu"},
                  {icon:isAddSub?"🐻🐹":"🐼🦊",label:"ふたりで",to:"duo"}
                ].map(btn=>(
                  <div key={btn.to} className="mode-card clickable"
                    style={{padding:"22px 28px",minWidth:130}}
                    onPointerDown={()=>{ playClick(); navigate(btn.to); }}>
                    <div style={{fontSize:"3rem"}}>{btn.icon}</div>
                    <div className="mode-card-label">{btn.label}</div>
                  </div>
                ))}
              </div>

              <div className="swipe-hint-text"
                onPointerDown={(e)=>{ e.preventDefault(); toggleMainMode(); }}>
                ‹ スワイプまたはタップで切り替え ›
              </div>
            </div>
          )}

          {/* ════════════════════════════════
              ソロ メニュー
          ════════════════════════════════ */}
          {screen==="solo-menu" && (
            <div style={{textAlign:"center",zIndex:10}}>
              <h2 style={{color:"#0e2010",fontSize:"1.8rem",marginBottom:28,fontWeight:900,
                textShadow:"0 2px 8px rgba(255,255,255,0.65)"}}>
                どちらであそぶ？
              </h2>
              <div style={{display:"flex",gap:16,justifyContent:"center"}}>
                {[
                  {icon:"⏱️",label:"30秒モード",sub:"はやおしチャレンジ",to:"solo-setup-time"},
                  {icon:"🚀",label:"サドンデス", sub:"ミスしたら終わり",  to:"solo-setup-death"}
                ].map(m=>(
                  <div key={m.to} className="mode-card clickable"
                    style={{padding:"22px 20px",minWidth:140}}
                    onPointerDown={()=>{ playClick(); navigate(m.to); }}>
                    <div style={{fontSize:"3rem"}}>{m.icon}</div>
                    <div className="mode-card-label">{m.label}</div>
                    <div style={{color:"rgba(20,35,0,0.48)",fontSize:"0.75rem",marginTop:4,fontWeight:700}}>
                      {m.sub}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ════════════════════════════════
              ソロ セットアップ
          ════════════════════════════════ */}
          {screen.includes("solo-setup") && (
            <div style={{...glassCard,maxWidth:420,width:"95%",zIndex:10,padding:"28px 24px"}}>
              <h2 style={{color:"#0e2010",marginBottom:20,fontWeight:900,fontSize:"1.3rem",textAlign:"center"}}>
                {screen.includes("time")?"⏱️ 30秒モード":"🚀 サドンデス"}
              </h2>
              <div style={{display:"flex",flexDirection:"column",gap:14}}>
                <div className="input-box-container"
                  onPointerDown={()=>{ if(!soloKb&&soloName==="プレイヤー1") setSoloName(""); setSoloKb(!soloKb); }}>
                  <span className="input-icon">🐥</span>
                  <div className="input-val">{soloName||"　"}</div>
                  <span className="input-pencil">✏️</span>
                </div>
                {soloKb
                  ? <JapaneseKeyboard value={soloName} onChange={setSoloName} isAddSub={isAddSub}
                      onSet={()=>{ if(!soloName.trim()) setSoloName("プレイヤー1"); setSoloKb(false); }}/>
                  : <>
                      {screen.includes("time")
                        ? <div style={{display:"flex",gap:8,width:"100%"}}>
                            <ToggleButton options={opOptions} value={soloOp} onChange={setSoloOp}/>
                            <ToggleButton options={lvOptions} value={soloLevel} onChange={setSoloLevel}/>
                          </div>
                        : <div style={{textAlign:"center",color:"rgba(20,35,0,0.62)",fontWeight:800,fontSize:"0.85rem",lineHeight:1.6}}>
                            {isAddSub?"たし算":"かけ算"}の ⭐ からスタート！<br/>10もん せいかいごとに レベルアップ
                          </div>
                      }
                      <button className="start-btn"
                        style={{
                          marginTop:6,width:"100%",
                          background:palette.accentGrad,
                          boxShadow:`0 4px 20px ${palette.accentShadow}`
                        }}
                        onPointerDown={screen.includes("time")?startSoloTime:startSoloDeath}>
                        スタート！
                      </button>
                    </>
                }
              </div>
            </div>
          )}

          {/* ════════════════════════════════
              カウントダウン（ソロ）
          ════════════════════════════════ */}
          {screen.includes("solo-countdown") && (
            <div style={{zIndex:100,textAlign:"center"}}>
              <p style={{color:"#0e2010",fontSize:"1.8rem",fontWeight:900,marginBottom:8,
                textShadow:"0 2px 8px rgba(255,255,255,0.65)"}}>
                よーい…
              </p>
              <div className="countdown-num" key={countdown}>{countdown}</div>
            </div>
          )}

          {/* ════════════════════════════════
              ソロ ゲーム
          ════════════════════════════════ */}
          {screen.includes("solo-game") && (
            <div style={{width:"100%",height:"100%",display:"flex",flexDirection:"column",
              alignItems:"center",justifyContent:"center",position:"relative"}}>

              <div className="solo-header">
                <div className="solo-header-label">
                  {screen.includes("death")
                    ? `🚀 ステージ ${deathLevel(soloScore)}`
                    : `🎖️ ${getRankLabel(soloScore)}`}
                </div>
                <div className="solo-score-badge"
                  style={{
                    background:palette.accentGrad,
                    boxShadow:`0 3px 12px ${palette.accentShadow}`
                  }}>
                  ✓ {soloScore}
                </div>
                <TimerRing
                  time={soloTime}
                  max={screen.includes("time")?TIME_LIMIT_30:SUDDEN_DEATH_PER_Q}
                  isAddSub={isAddSub}/>
              </div>

              <GamePanel
                feedback={fb1} current={q1}
                onAnswer={screen.includes("time")?handleSoloAnsTime:handleSoloAnsDeath}
                typed={typed1} hw={hw} hand={inputs.p1==="hand"} locked={soloFinish} accent={palette.accent}/>

              {soloFinish && (
                <div className="result-overlay">
                  <div className="result-band"
                    style={{background:"rgba(255,255,255,0.75)",color:"#0e2010"}}>
                    そこまで！
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ════════════════════════════════
              対戦（えらぶ・ゲーム・けっか を1つの画面で）
          ════════════════════════════════ */}
          {screen==="duo" && (()=>{
            const PL = {
              1:{ name:p1Name, setName:setP1Name, kb:p1Kb, setKb:setP1Kb, op:p1Op, setOp:setP1Op, lv:p1Level, setLv:setP1Level,
                  ready:p1Ready, setReady:setP1Ready, def:"プレイヤー1", icon:isAddSub?"🐻":"🐼", score:p1Score,
                  q:q1, fb:fb1, typed:typed1, hand:inputs.p1==="hand" },
              2:{ name:p2Name, setName:setP2Name, kb:p2Kb, setKb:setP2Kb, op:p2Op, setOp:setP2Op, lv:p2Level, setLv:setP2Level,
                  ready:p2Ready, setReady:setP2Ready, def:"プレイヤー2", icon:isAddSub?"🐹":"🦊", score:p2Score,
                  q:q2, fb:fb2, typed:typed2, hand:inputs.p2==="hand" },
            };
            // えらぶ（名前・計算の種類・レベル・けってい）
            const setupCard = (p) => { const P = PL[p]; return (
              <div style={{...glassCard,width:"100%",maxWidth:460,padding:"14px 16px"}}>
                <div className="input-box-container" style={{marginBottom:10}}
                  onPointerDown={()=>{ if(!P.kb&&P.name===P.def) P.setName(""); P.setKb(!P.kb); }}>
                  <span className="input-icon">{P.icon}</span>
                  <div className="input-val">{P.name||"　"}</div>
                  <span className="input-pencil">✏️</span>
                </div>
                {P.kb
                  ? <JapaneseKeyboard value={P.name} onChange={P.setName} isAddSub={isAddSub}
                      onSet={()=>{ if(!P.name.trim()) P.setName(P.def); P.setKb(false); }}/>
                  : <>
                      <div style={{display:"flex",gap:8}}>
                        <ToggleButton options={opOptions} value={P.op} onChange={P.setOp}/>
                        <ToggleButton options={lvOptions} value={P.lv} onChange={P.setLv}/>
                      </div>
                      <button className={`status-btn ${P.ready?"wait":"ready"}`}
                        onPointerDown={()=>{ playClick(); P.setReady(!P.ready); }}>
                        {P.ready?"⏳ まってね":"✓ けってい！"}
                      </button>
                    </>}
              </div>
            ); };
            // けっか（タップでウインドウ →「もう一回！」「えらびなおす」）
            const resultArea = (p) => { const P = PL[p], won = winner===p; return (
              <div className="duo-result-area"
                onPointerDown={()=>{
                  if (resOpen[p] || performance.now()-overAt.current <= 700) return;
                  playClick();
                  // 相手がもうモード選択にいるなら、タップでそのままモード選択へ
                  if (duoView[p===1?2:1]==="setup") setDuoView(v=>({ ...v, [p]:"setup" }));
                  else setResOpen(o=>({ ...o, [p]:true }));
                }}>
                <div className="result-band" style={{
                  background:won?"rgba(255,255,255,0.82)":"rgba(255,255,255,0.55)",
                  color:won?palette.accentDark:"rgba(30,35,0,0.50)"
                }}>
                  {won?"🎉 クリア！！":"🏳️ そこまで…"}
                  {!resOpen[p] && <div className="tap-hint">タップしてね</div>}
                </div>
                {resOpen[p] && (
                  <div className="duo-res-win" style={glassCard} onPointerDown={e=>e.stopPropagation()}>
                    <div className="duo-res-title">{won?"🏆 かち！":"おしかった！"}<span>{P.score}点</span></div>
                    <button className="start-btn" style={P.ready
                        ? {background:"linear-gradient(135deg,#4a9e62,#2e7d46)"}
                        : {background:palette.accentGrad,boxShadow:`0 4px 20px ${palette.accentShadow}`}}
                      onPointerDown={e=>{ e.preventDefault(); playClick(); P.setReady(!P.ready); }}>
                      {P.ready?"⏳ まってね":"もう一回！"}
                    </button>
                    <button className="start-btn secondary"
                      onPointerDown={e=>{
                        e.preventDefault(); playClick(); setP1Ready(false); setP2Ready(false);
                        // 相手がまだ「クリア／そこまで…」を見ている（タップ前）なら、相手はそのまま
                        const o = p===1?2:1;
                        setDuoView(v=>({ ...v, [p]:"setup", [o]: resOpen[o] ? "setup" : v[o] }));
                      }}>
                      えらびなおす
                    </button>
                  </div>
                )}
              </div>
            ); };
            const content = (p) => {
              const P = PL[p];
              if (duoPhase==="countdown") return <div className="countdown-num" key={p+"-"+countdown}>{countdown}</div>;
              if (duoPhase==="game") return <GamePanel isMini current={P.q} feedback={P.fb}
                onAnswer={v=>handleDuoAns(p,v)} typed={P.typed} hw={hw} hand={P.hand} locked={!!winner} rotated={p===2} accent={palette.accent}/>;
              if (duoPhase==="over" && duoView[p]==="result") return resultArea(p);
              return <div style={{width:"100%",display:"flex",justifyContent:"center",padding:"8px 12px",position:"relative",zIndex:1}}>{setupCard(p)}</div>;
            };
            const header = (p, top) => (
              <div style={{
                textAlign:"center",color:"#0e2010",fontWeight:900,padding:"6px 0",fontSize:"0.9rem",
                background:top?"rgba(255,255,255,0.25)":"rgba(255,255,255,0.20)",
                [top?"borderBottom":"borderTop"]:"2px solid rgba(255,255,255,0.52)"
              }}>
                {PL[p].icon}&nbsp;{PL[p].name}
                <span style={{marginLeft:10,fontWeight:900,fontSize:"0.9rem",color:palette.accentDark}}>{PL[p].score}点</span>
              </div>
            );
            // けっかのときは、二人ともタップするまで出さない（ゴールした動物を見せる）
            const tapped = p => resOpen[p] || duoView[p]==="setup";
            const canPickGoal = duoPhase==="setup" || (duoPhase==="over" && tapped(1) && tapped(2));
            const pos = sc => `${Math.min(1, sc/duoGoal)*100}%`;
            // トラックの動物：正解で進むときは小さく跳ねながら、勝った方はゴールでぴょんぴょん
            const animal = p => {
              const won = duoPhase==="over" && winner===p, sc = PL[p].score;
              return won
                ? <span className="race-animal race-win">{PL[p].icon}</span>
                : <span key={sc} className={`race-animal ${sc>0?"race-hop":""}`}>{PL[p].icon}</span>;
            };
            return (
              <div style={{flex:1,width:"100%",display:"flex",flexDirection:"column",zIndex:10}}>
                {/* P2エリア（上・回転） */}
                <div style={{transform:"rotate(180deg)",flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
                  {header(2,true)}
                  <div className="duo-area">{duoPhase==="over" && winner===2 && <Confetti contained/>}{content(2)}</div>
                </div>

                {/* レーストラック */}
                <div className="race-track">
                  <div className="race-label" style={{left:65,background:"rgba(200,165,20,0.92)",color:"#3a2200"}}>START</div>
                  <div className="race-label" style={{right:65,background:"rgba(168,40,40,0.92)",color:"white"}}>GOAL!</div>
                  <div style={{position:"absolute",left:140,right:140,top:0,bottom:0}}>
                    {[...Array(duoGoal+1)].map((_,i)=>(
                      <div key={i} style={{position:"absolute",height:"100%",width:1,background:"rgba(255,255,255,0.35)",left:`${(i/duoGoal)*100}%`}}/>
                    ))}
                    <div className="race-icon" style={{left:pos(p2Score),top:"3%",transform:"translateX(-50%) rotate(180deg)"}}>{animal(2)}</div>
                    <div className="race-icon" style={{left:pos(p1Score),top:"48%",transform:"translateX(-50%)"}}>{animal(1)}</div>
                  </div>
                  {/* 問題数（えらぶとき・けっかのときだけ、トラックの上に重ねる） */}
                  {canPickGoal && (
                    <div className="goal-toggle">
                      <ToggleButton options={[{v:5,l:"5もん"},{v:10,l:"10もん"},{v:20,l:"20もん"}]} value={duoGoal} onChange={setDuoGoal}/>
                    </div>
                  )}
                </div>

                {/* P1エリア（下） */}
                <div style={{flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
                  {header(1,false)}
                  <div className="duo-area">{duoPhase==="over" && winner===1 && <Confetti contained/>}{content(1)}</div>
                </div>
              </div>
            );
          })()}

          
{/* ════════════════════════════════
              リザルト
          ════════════════════════════════ */}
          {screen.includes("result") && (
            <>
              <Confetti/>
              <div style={{
                ...glassCard,
                width:"92%",maxWidth:400,
                zIndex:1000,animation:"cPop 0.4s",
                padding:"36px 28px",textAlign:"center"
              }}>
                <div style={{fontSize:"4.5rem",marginBottom:8}}>🏆</div>
                <h2 style={{color:"#0e2010",fontSize:"1.6rem",fontWeight:900,marginBottom:20}}>
                  結果発表
                </h2>

                {screen.includes("solo")
                  ? <>
                      <div className="result-score">{finalScoreRef.current}</div>
                      <div className="result-label">もん せいかい</div>
                      <div style={{color:"rgba(20,35,0,0.55)",fontSize:"0.9rem",marginTop:10,fontWeight:800}}>
                        🎖️ {getRankLabel(finalScoreRef.current)}
                      </div>
                    </>
                  : <>
                      <div style={{fontSize:"1.6rem",fontWeight:900,marginBottom:4,color:palette.accentDark}}>
                        {winnerName}
                      </div>
                      <div className="result-label">のかち！</div>
                      <div style={{display:"flex",justifyContent:"center",gap:24,marginTop:12}}>
                        <div style={{color:"rgba(30,35,0,0.58)",fontWeight:800,fontSize:"0.9rem"}}>
                          {p1Name}：{p1Score}点
                        </div>
                        <div style={{color:"rgba(30,35,0,0.58)",fontWeight:800,fontSize:"0.9rem"}}>
                          {p2Name}：{p2Score}点
                        </div>
                      </div>
                    </>
                }

                <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:28}}>
                  <button className="start-btn"
                    style={{
                      background:palette.accentGrad,
                      boxShadow:`0 4px 20px ${palette.accentShadow}`
                    }}
                    onPointerDown={()=>{
                      screen.includes("time")  ? startSoloTime()  :
                      screen.includes("death") ? startSoloDeath() :
                      startDuo();
                    }}>
                    もう一回！
                  </button>
                  <button className="start-btn secondary" onPointerDown={goTop}>
                    タイトルへ
                  </button>
                </div>
              </div>
            </>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
